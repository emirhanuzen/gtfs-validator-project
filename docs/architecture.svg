<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg">
<style>
  .box { fill: #eef4ff; stroke: #4a76c9; stroke-width: 1.5; rx: 8; }
  .box2 { fill: #eafaf1; stroke: #2e9e63; stroke-width: 1.5; rx: 8; }
  .title { font-family: Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
  .sub { font-family: Arial, sans-serif; font-size: 11.5px; fill: #333333; text-anchor: middle; }
  .lbl { font-family: Arial, sans-serif; font-size: 11px; fill: #555555; text-anchor: middle; }
  .arrow { stroke: #555555; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  .dash { stroke: #888888; stroke-width: 1; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrowhead); }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
  </marker>
</defs>

<line x1="20" y1="180" x2="700" y2="180" stroke="#bbbbbb" stroke-dasharray="6 4"/>
<text x="660" y="175" class="lbl">asenkron başlıyor</text>

<rect x="260" y="20" width="200" height="50" class="box"/>
<text x="360" y="42" class="title">Client</text>
<text x="360" y="60" class="sub">ZIP yükler</text>

<rect x="260" y="110" width="200" height="50" class="box"/>
<text x="360" y="132" class="title">FastAPI</text>
<text x="360" y="150" class="sub">Kabul eder, task başlatır</text>

<line x1="360" y1="70" x2="360" y2="110" class="arrow"/>
<path d="M460,120 L490,120 L490,45 L460,45" class="dash"/>
<text x="600" y="90" class="lbl">202 + import_id</text>

<rect x="260" y="200" width="200" height="50" class="box2"/>
<text x="360" y="222" class="title">RabbitMQ</text>
<text x="360" y="240" class="sub">Task kuyruğu (Celery yönetir)</text>
<line x1="360" y1="160" x2="360" y2="200" class="arrow"/>

<rect x="260" y="290" width="200" height="50" class="box2"/>
<text x="360" y="312" class="title">Celery Worker</text>
<text x="360" y="330" class="sub">Doğrular, kaydeder, event yayınlar</text>
<line x1="360" y1="250" x2="360" y2="290" class="arrow"/>

<rect x="100" y="380" width="170" height="50" class="box2"/>
<text x="185" y="402" class="title">PostgreSQL</text>
<text x="185" y="420" class="sub">Import + GTFS verisi</text>
<path d="M310,340 L310,360 L185,360 L185,380" class="arrow"/>

<rect x="450" y="380" width="170" height="50" class="box2"/>
<text x="535" y="402" class="title">RabbitMQ</text>
<text x="535" y="420" class="sub">Event yayınlar</text>
<path d="M410,340 L410,360 L535,360 L535,380" class="arrow"/>
<text x="535" y="450" class="lbl">exchange: gtfs.events</text>
<text x="535" y="465" class="lbl">routing key: gtfs.import.*</text>

<rect x="450" y="500" width="170" height="50" class="box2"/>
<text x="535" y="522" class="title">Audit Consumer</text>
<text x="535" y="540" class="sub">Event'i dinler, loglar</text>
<line x1="535" y1="430" x2="535" y2="500" class="arrow"/>

<path d="M100,405 L60,405 L60,135 L260,135" class="dash"/>
<text x="150" y="100" class="lbl">durum sorgusu (GET, pull)</text>

<rect x="20" y="560" width="14" height="14" fill="#eef4ff" stroke="#4a76c9"/>
<text x="120" y="571" class="lbl" text-anchor="start">senkron (HTTP)</text>
<rect x="220" y="560" width="14" height="14" fill="#eafaf1" stroke="#2e9e63"/>
<text x="320" y="571" class="lbl" text-anchor="start">asenkron (arka plan)</text>
</svg>
