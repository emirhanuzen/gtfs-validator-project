
services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: kullanici
      POSTGRES_PASSWORD: sifre
      POSTGRES_DB: gtfs_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kullanici -d gtfs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kullanici:sifre@postgres:5432/gtfs_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kullanici:sifre@postgres:5432/gtfs_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      UPLOAD_DIR: uploads
    command: celery -A app.tasks.celery_app worker --loglevel=info